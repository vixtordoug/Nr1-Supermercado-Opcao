<!doctype html>
<html lang="pt-BR">

<head>

<body>
  <div id="root"></div>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Canal de Denúncias NR1 — Acesso</title>
  <style>
    :root {
      --red: #e3262d;
      --red-dark: #b9141b;
      --red-soft: #fff0f1;
      --orange: #f59a3d;
      --blue: #3b82f6;
      --green: #20a464;
      --ink: #24272c;
      --muted: #747b85;
      --line: #e7e9ed;
      --bg: #f7f8fa
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink)
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    .hidden {
      display: none !important
    }

    .start {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 15%, #e3262d14, transparent 25%), radial-gradient(circle at 90% 80%, #3b82f612, transparent 24%), #f8f9fb;
      display: flex;
      flex-direction: column
    }

    .start-head {
      height: 76px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .start-brand {
      display: flex;
      align-items: center;
      gap: 11px
    }

    .start-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--red-dark), var(--red));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 7px 18px #e3262d2b
    }

    .start-brand b {
      font-size: 19px
    }

    .start-brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px
    }

    .start-body {
      width: min(1120px, 92%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 470px;
      gap: 75px;
      align-items: center;
      padding: 50px 0
    }

    .start-copy .tag,
    .login-copy .tag {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 20px;
      background: var(--red-soft);
      border: 1px solid #f2cdd0;
      color: var(--red-dark);
      font-size: 11px;
      font-weight: 900
    }

    .start-copy h1 {
      font-size: 46px;
      line-height: 1.08;
      letter-spacing: -1.4px;
      margin: 18px 0 13px
    }

    .start-copy h1 span,
    .login-copy h1 span {
      color: var(--red)
    }

    .start-copy>p {
      max-width: 580px;
      color: #68707a;
      font-size: 16px;
      line-height: 1.65
    }

    .start-benefits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 28px
    }

    .start-benefit {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px
    }

    .start-benefit i {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--red-soft);
      color: var(--red-dark);
      font-style: normal
    }

    .start-benefit b {
      display: block;
      font-size: 12px;
      margin-top: 8px
    }

    .start-benefit small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
      margin-top: 3px
    }

    .start-card,
    .login-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px #1e232d1a;
      position: relative
    }

    .start-card:before,
    .login-card:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 5px;
      border-radius: 18px 18px 0 0;
      background: linear-gradient(90deg, var(--red), #ef4444, var(--orange))
    }

    .start-card h2 {
      font-size: 23px;
      margin: 0 0 5px
    }

    .start-card>p {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 20px
    }

    .start-option {
      width: 100%;
      min-height: 74px;
      margin: 9px 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      display: grid;
      grid-template-columns: 43px 1fr 20px;
      align-items: center;
      text-align: left;
      padding: 12px 13px;
      cursor: pointer;
      transition: .16s
    }

    .start-option:hover {
      transform: translateY(-2px);
      border-color: #e5a4a8;
      background: #fffafa;
      box-shadow: 0 8px 20px #e3262d12
    }

    .start-option .ico {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--red-soft);
      color: var(--red-dark);
      font-style: normal;
      font-size: 17px
    }

    .start-option:nth-of-type(2) .ico {
      background: #fff4e8;
      color: #c96d16
    }

    .start-option:nth-of-type(3) .ico {
      background: #edf4ff;
      color: #2865bd
    }

    .start-option b {
      display: block;
      font-size: 13px
    }

    .start-option small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px
    }

    .start-option em {
      font-style: normal;
      font-size: 23px;
      color: #aeb4bc
    }

    .start-anon {
      margin-top: 18px;
      padding: 11px;
      border-radius: 9px;
      background: #f7faf8;
      color: #4d6b59;
      font-size: 10px;
      text-align: center;
      border: 1px solid #dceee3
    }

    .start-foot {
      text-align: center;
      color: #9298a0;
      font-size: 10px;
      padding: 14px;
      border-top: 1px solid var(--line);
      background: #fff
    }

    .login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff6f6 0%, #fff 55%, #f3f7ff 100%)
    }

    .login-head {
      height: 74px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .login-body {
      width: min(1050px, 92%);
      margin: auto;
      min-height: calc(100vh - 74px);
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 70px;
      align-items: center
    }

    .login-copy h1 {
      font-size: 42px;
      line-height: 1.08;
      letter-spacing: -1px;
      margin: 16px 0 10px
    }

    .login-copy>p {
      color: #68707a;
      line-height: 1.65;
      max-width: 550px
    }

    .login-help {
      display: grid;
      gap: 10px;
      margin-top: 25px
    }

    .login-help div {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 12px
    }

    .login-help i {
      font-style: normal;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eaf7ef;
      color: #198754;
      display: grid;
      place-items: center;
      font-weight: 900
    }

    .login-card {
      padding: 30px
    }

    .login-card-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 22px
    }

    .login-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--red-soft);
      color: var(--red-dark);
      display: grid;
      place-items: center;
      font-size: 19px
    }

    .login-card h2 {
      font-size: 22px;
      margin: 0 0 3px
    }

    .login-card .sub {
      font-size: 11px;
      color: var(--muted);
      margin: 0
    }

    .login-card label {
      font-size: 12px;
      font-weight: 800;
      display: block;
      margin: 15px 0 7px
    }

    .field {
      height: 47px;
      border: 1px solid #dfe2e7;
      border-radius: 9px;
      background: #fbfcfd;
      display: flex;
      align-items: center
    }

    .field:focus-within {
      border-color: #d95d63;
      box-shadow: 0 0 0 3px #e3262d12;
      background: #fff
    }

    .field span {
      width: 40px;
      text-align: center;
      color: var(--red-dark);
      font-size: 16px
    }

    .field input {
      width: 100%;
      height: 100%;
      border: 0 !important;
      outline: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 10px 0 0 !important
    }

    .hint {
      font-size: 10px;
      color: #8a9098;
      margin-top: 4px
    }

    .login-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--red-dark), var(--red));
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 8px 18px #e3262d2b
    }

    .back {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      color: #5e6670;
      font-weight: 700;
      cursor: pointer
    }

    @media(max-width:850px) {

      .start-body,
      .login-body {
        grid-template-columns: 1fr;
        gap: 25px
      }

      .start-copy h1,
      .login-copy h1 {
        font-size: 35px
      }

      .start-benefits {
        grid-template-columns: 1fr
      }

      .login-body {
        padding: 30px 0
      }

      .start-body {
        padding: 30px 0
      }
    }

    @media(max-width:600px) {

      .start-head,
      .login-head {
        padding: 0 18px
      }

      .start-body,
      .login-body {
        width: 92%
      }

      .start-card,
      .login-card {
        padding: 23px
      }
    }

    /* ===== ÁREA ADMINISTRATIVA — VISUAL CORPORATIVO ===== */
    .app {
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #f8f9fb 0%, #f3f5f8 100%)
    }

    .side {
      width: 248px;
      min-height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      background: linear-gradient(180deg, #17191d 0%, #22252a 100%);
      padding: 20px 13px;
      box-shadow: 8px 0 30px rgba(24, 28, 35, .14);
      z-index: 20;
      display: flex;
      flex-direction: column
    }

    .logo {
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.4px;
      padding: 3px 11px 22px;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .logo:before {
      content: '✓';
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #b9141b, #e3262d);
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 7px 17px rgba(227, 38, 45, .3)
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .nav button {
      border: 1px solid transparent;
      background: transparent;
      color: #cbd0d7;
      text-align: left;
      border-radius: 10px;
      padding: 12px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .16s;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .nav button:hover {
      background: #2d3036;
      color: #fff;
      transform: translateX(2px)
    }

    .nav button.active {
      background: linear-gradient(90deg, #b9141b, #e3262d);
      color: #fff;
      box-shadow: 0 7px 18px rgba(227, 38, 45, .22)
    }

    .side .nav.logout {
      margin-top: auto;
      background: #fff;
      color: #25282d;
      justify-content: center;
      border: 0
    }

    .side .nav.logout:hover {
      background: #fff0f1;
      color: #b9141b;
      transform: none
    }

    .side .nav.logout.danger {
      font-weight: 800
    }

    .main {
      margin-left: 248px;
      width: calc(100% - 248px);
      min-height: 100vh;
      padding: 34px 42px 55px
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px
    }

    .top h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -.7px;
      color: #20242a
    }

    .user {
      color: #747b85;
      font-size: 12px;
      margin-top: 6px
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 24px
    }

    .card {
      background: #fff;
      border: 1px solid #e4e7eb;
      border-radius: 15px;
      padding: 19px 20px;
      box-shadow: 0 9px 25px rgba(28, 34, 42, .06);
      position: relative;
      overflow: hidden
    }

    .card:before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #e3262d
    }

    .card:nth-child(2):before {
      background: #f59a3d
    }

    .card:nth-child(3):before {
      background: #3b82f6
    }

    .card:nth-child(4):before {
      background: #20a464
    }

    .muted {
      color: #747b85;
      font-size: 12px
    }

    .num {
      font-size: 31px;
      font-weight: 900;
      margin-top: 7px;
      color: #20242a
    }

    .section {
      background: #fff;
      border: 1px solid #e4e7eb;
      border-radius: 15px;
      padding: 22px;
      box-shadow: 0 9px 25px rgba(28, 34, 42, .05)
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 18px
    }

    .section p {
      line-height: 1.55
    }

    .table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px
    }

    .table th {
      background: #f8f9fb;
      color: #69717b;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .45px;
      text-align: left;
      padding: 13px 12px;
      border-top: 1px solid #e7e9ed;
      border-bottom: 1px solid #e7e9ed
    }

    .table th:first-child {
      border-left: 1px solid #e7e9ed;
      border-radius: 9px 0 0 0
    }

    .table th:last-child {
      border-right: 1px solid #e7e9ed;
      border-radius: 0 9px 0 0
    }

    .table td {
      padding: 14px 12px;
      border-bottom: 1px solid #eef0f3;
      color: #424850;
      background: #fff
    }

    .table tr:hover td {
      background: #fff8f8
    }

    .table td:first-child {
      font-weight: 600
    }

    .link {
      background: none;
      border: 0;
      color: #bd1820;
      cursor: pointer;
      font-weight: 800
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff0f1;
      color: #b9141b;
      border: 1px solid #f3d0d3;
      font-size: 10px;
      font-weight: 800
    }

    .mini {
      border: 1px solid #dfe2e7;
      background: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      color: #59616b;
      font-weight: 800;
      cursor: pointer
    }

    .mini:hover {
      border-color: #e3262d;
      color: #b9141b;
      background: #fff8f8
    }

    .mini.red,
    .btn {
      border: 0;
      background: linear-gradient(135deg, #b9141b, #e3262d);
      color: #fff;
      box-shadow: 0 7px 17px rgba(227, 38, 45, .18)
    }

    .btn {
      border-radius: 9px;
      padding: 11px 17px;
      font-weight: 800;
      cursor: pointer
    }

    .btn:hover {
      filter: brightness(1.04);
      transform: translateY(-1px)
    }

    .box {
      background: #fff;
      border: 1px solid #e4e7eb;
      border-radius: 17px;
      box-shadow: 0 18px 50px rgba(28, 34, 42, .14);
      padding: 27px;
      position: relative
    }

    .box h2 {
      margin: 0 0 4px;
      font-size: 22px
    }

    .box label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 800;
      color: #30353b
    }

    .box input,
    .box select,
    .box textarea {
      width: 100%;
      border: 1px solid #dfe2e7;
      border-radius: 9px;
      background: #fbfcfd;
      padding: 11px 12px;
      outline: none;
      color: #30353b
    }

    .box input:focus,
    .box select:focus,
    .box textarea:focus {
      border-color: #d95d63;
      box-shadow: 0 0 0 3px rgba(227, 38, 45, .09);
      background: #fff
    }

    .box textarea {
      min-height: 125px;
      resize: vertical
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px
    }

    .formgrid .full {
      grid-column: 1/-1
    }

    .success {
      background: #edf8f1;
      border: 1px solid #ccebd7;
      color: #197343;
      border-radius: 9px
    }

    .error {
      background: #fff0f1;
      border: 1px solid #f2c9cc;
      color: #b9141b;
      border-radius: 9px;
      padding: 10px;
      margin-top: 10px
    }

    .small {
      font-size: 10px;
      color: #858c95
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 23, 28, .57);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px
    }

    .modal .box {
      width: min(760px, 96vw);
      max-height: 90vh;
      overflow: auto
    }

    .panel {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 15%, rgba(227, 38, 45, .06), transparent 25%), #f7f8fa;
      padding: 50px 20px
    }

    .panel .box {
      width: min(680px, 96vw);
      margin: 0 auto
    }

    .panel h2 {
      font-size: 26px
    }

    .panel .btn {
      margin-top: 18px
    }

    @media(max-width:900px) {
      .side {
        width: 210px
      }

      .main {
        margin-left: 210px;
        width: calc(100% - 210px);
        padding: 28px 24px
      }

      .cards {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:650px) {
      .side {
        position: relative;
        width: 100%;
        min-height: auto;
        height: auto
      }

      .app {
        display: block
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 22px 15px
      }

      .side .nav {
        display: grid;
        grid-template-columns: 1fr 1fr
      }

      .side .nav.logout {
        margin-top: 12px
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px
      }

      .card {
        padding: 15px
      }

      .num {
        font-size: 25px
      }

      .section {
        padding: 14px;
        overflow: auto
      }

      .table {
        min-width: 650px
      }

      .top {
        align-items: flex-start
      }

      .formgrid {
        grid-template-columns: 1fr
      }

      .formgrid .full {
        grid-column: auto
      }

      .modal {
        padding: 12px
      }

      .box {
        padding: 20px
      }
    }

    .table .mini {
      padding: 7px 11px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e4e7eb;
      color: #b9141b;
      font-weight: 800;
      cursor: pointer
    }

    .table .mini:hover {
      background: #fff0f1;
      border-color: #e7a8ac
    }

    .tag.ok {
      background: #eaf7ef;
      color: #18794e;
      border-color: #ccebd9
    }

    .tag.mutedtag {
      background: #f1f3f5;
      color: #6f767e;
      border-color: #dfe3e7
    }

    .success {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 8px;
      background: #eaf8f0;
      border: 1px solid #ccebd9;
      color: #16804b;
      font-size: 11px
    }

    .chat-form button:disabled {
      opacity: .65;
      cursor: wait
    }

    .type-tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      z-index: 9999;
      left: 0;
      top: calc(100% + 8px);
      width: min(340px, 90vw);
      padding: 10px 12px;
      border-radius: 8px;
      background: #1f2937;
      color: #ffffff;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 400;
      text-align: left;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    }

    .type-tooltip:hover::after,
    .type-tooltip:focus-within::after {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
  </style>

  </style>
  <style>
    .chat {
      margin-top: 20px;
      border: 1px solid #e4e7eb;
      border-radius: 14px;
      background: #fff;
      overflow: hidden
    }

    .chat-head {

    <script id="security-key-validation">
      (function () {
        function validKey(v) { return v.length >= 6 && /\d/.test(v) }
        function wire() {
          const k = document.getElementById('securityKey'), c = document.getElementById('securityKeyConfirm'); if (!k || !c || k.dataset.wired) return;
          k.dataset.wired = c.dataset.wired = '1';
          const sync = () => { const a = k.value, b = c.value; document.getElementById('keyRuleLength')?.classList.toggle('ok', a.length >= 6); document.getElementById('keyRuleNumber')?.classList.toggle('ok', /\d/.test(a)); document.getElementById('keyRuleMatch')?.classList.toggle('ok', a.length > 0 && a === b); const e = document.getElementById('securityKeyError'); if (e) e.textContent = a && !validKey(a) ? 'A chave precisa ter pelo menos 6 caracteres e conter pelo menos 1 número.' : b && a !== b ? 'As chaves não coincidem.' : '' };
          k.addEventListener('input', sync); c.addEventListener('input', sync);
          const f = k.closest('form'); if (f && !f.dataset.keyValidation) { f.dataset.keyValidation = '1'; f.addEventListener('submit', e => { if (!validKey(k.value) || k.value !== c.value) { e.preventDefault(); e.stopImmediatePropagation(); sync(); k.focus(); return false } }, true) }
        }
        new MutationObserver(wire).observe(document.documentElement, { subtree: true, childList: true }); wire();
      })();
    </script>
    <script id="security-save-key-delegation">
      document.addEventListener("click", async function (e) {
        const b = e.target.closest && e.target.closest("#saveSecurityKeyButton");
        if (!b) return;
        e.preventDefault(); e.stopPropagation();
        const k = document.getElementById("newSecurityKey"), c = document.getElementById("newSecurityKeyConfirm"), m = document.getElementById("newSecurityKeyMsg");
        if (!k || !c || !m) return;
        const v = (k.value || "").trim(), cv = (c.value || "").trim();
        if (v.length < 6 || !/\d/.test(v)) { m.innerHTML = '<div class="error">A chave deve ter, no mínimo, 6 caracteres e conter pelo menos 1 número.</div>'; k.focus(); return; }
        if (v !== cv) { m.innerHTML = '<div class="error">As chaves não coincidem. Confira a chave informada.</div>'; c.focus(); return; }
        const p = b.dataset.protocol || (window.__securitySetup && window.__securitySetup.protocol) || "";
        const t = b.dataset.setupToken || (window.__securitySetup && window.__securitySetup.setupToken) || "";
        if (!p || !t) { m.innerHTML = '<div class="error">Não foi possível identificar a sessão de configuração da chave. Gere uma nova denúncia para continuar.</div>'; return; }
        const old = b.textContent; b.disabled = true; b.textContent = "salvando chave...";
        try {
          await api("/api/public/protocol/" + encodeURIComponent(p) + "/security-key", { method: "POST", body: JSON.stringify({ setupToken: t, securityKey: v }) });
          m.innerHTML = '<div class="security-save-overlay" role="dialog" aria-modal="true"><div class="security-save-modal"><div class="security-save-icon">✓</div><h3>chave de segurança salva com sucesso!</h3><p>sua chave foi definida e está vinculada ao protocolo abaixo. por segurança, ela não será exibida. para consultar sua denúncia e acessar o chat, você deverá informar <strong>o protocolo e a chave de segurança</strong>.</p><div class="security-save-protocol">' + esc(p) + '</div><p>guarde essas duas informações em um local seguro. por segurança, a chave não poderá ser recuperada.</p><button class="security-save-home" type="button" onclick="window.location.reload();return false;">voltar para a tela inicial</button></div></div>';
          k.disabled = true; c.disabled = true;
        } catch (err) { m.innerHTML = '<div class="error">' + esc(err.message || "Não foi possível salvar a chave de segurança.") + '</div>'; b.disabled = false; b.textContent = old; }
      }, true);
    </script>

    <script id="tipos-ocorrencia-hover-script-20260916">
      (function () {
        function iniciarTiposOcorrencia() {
          var caixa = document.getElementById("tipoOcorrenciaCustom");
          if (!caixa || caixa.getAttribute("data-iniciado") === "sim") return;

          caixa.setAttribute("data-iniciado", "sim");

          var botao = document.getElementById("typeSelectButton");
          var campo = document.getElementById("type");
          var opcoes = caixa.querySelectorAll(".tipo-ocorrencia-option");

          botao.addEventListener("click", function () {
            caixa.classList.toggle("aberto");
          });

          opcoes.forEach(function (opcao) {
            opcao.addEventListener("click", function () {
              campo.value = opcao.getAttribute("data-value");
              botao.querySelector("span").textContent = opcao.querySelector("strong").textContent;
              caixa.classList.remove("aberto");
            });
          });

          document.addEventListener("click", function (evento) {
            if (!caixa.contains(evento.target)) {
              caixa.classList.remove("aberto");
            }
          });
        }

        var observador = new MutationObserver(iniciarTiposOcorrencia);
        observador.observe(document.body, {
          childList: true,
          subtree: true
        });

        iniciarTiposOcorrencia();
      })();
    </script>

    <script id="report-attachments-script">
      (function () {
        var descriptor = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
        var field = '<div class="full"><label for="reportAttachments">Anexos (opcional)</label><input id="reportAttachments" name="attachments" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,application/pdf,.jpg,.jpeg,.png,.webp,.mp4,.mov"><small style="display:block;color:#747b85;font-size:10px;margin-top:5px">Selecione fotos, vídeos ou PDFs (até 100 MB por arquivo).</small></div>';
        Object.defineProperty(Element.prototype, 'innerHTML', {
          configurable: descriptor.configurable,
          enumerable: descriptor.enumerable,
          get: descriptor.get,
          set: function (value) {
            if (this.id === 'root' && value.indexOf('<form id="reportForm"') !== -1 && value.indexOf('id="reportAttachments"') === -1) {
              value = value.replace('</textarea></div><div class="full">', '</textarea></div>' + field + '<div class="full">');
            }
            descriptor.set.call(this, value);
          }
        });
        function showLoadedAttachments() {
          var modal = document.getElementById('modal'), detail = window.__lastReportDetail;
          if (modal && detail && detail.attachments && !modal.querySelector('.report-attachments')) {
            var section = modal.querySelector('.section');
            if (section) section.insertAdjacentHTML('beforeend', attachmentsHtml(detail.attachments, function (id) { return '/api/admin/reports/' + detail.id + '/attachments/' + id; }));
          }
          var publicForm = document.querySelector('.chat-form[data-public-chat="1"]'), publicBox = document.querySelector('.track-page .section');
          if (publicForm && publicBox && !publicBox.querySelector('.report-attachments')) {
            var protocol = publicForm.dataset.protocol, key = publicForm.dataset.protocolKey;
            fetch('/api/public/protocol/' + encodeURIComponent(protocol), { headers: { 'X-Protocol-Key': key } }).then(function (response) { return response.json(); }).then(function (data) {
              if (!publicBox.querySelector('.report-attachments')) publicBox.insertAdjacentHTML('beforeend', attachmentsHtml(data.attachments, function (id) { return '/api/public/protocol/' + encodeURIComponent(protocol) + '/attachments/' + id; }, key));
            }).catch(function () {});
          }
        }
        var attachmentObserver = new MutationObserver(showLoadedAttachments);
        attachmentObserver.observe(document.body, { childList: true, subtree: true });
        showLoadedAttachments();
      })();
    </script>
