<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermercado Opção | Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#b90d19;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.06)}
.one{width:520px;height:520px;top:-250px;right:-150px}
.two{width:420px;height:420px;bottom:-240px;left:-130px}
.container{width:min(92%,760px);position:relative;z-index:1}
.card{background:rgba(255,255,255,.98);color:#172033;border-radius:24px;padding:52px 46px;text-align:center;box-shadow:0 25px 70px rgba(70,0,0,.28)}
.logo{width:72px;height:72px;margin:0 auto 22px;border-radius:18px;background:#df1723;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;box-shadow:0 12px 25px rgba(223,23,35,.25)}
.eyebrow{color:#df1723;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin-bottom:14px}
.subtitle{color:#596273;font-size:17px;line-height:1.6;max-width:570px;margin:0 auto 34px}
.actions{display:flex;justify-content:center}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:290px;padding:16px 28px;border-radius:12px;background:#df1723;color:#fff;text-decoration:none;font-size:16px;font-weight:800;box-shadow:0 12px 24px rgba(223,23,35,.25);transition:transform .2s,box-shadow .2s,background .2s}
.button:hover{background:#c9101c;transform:translateY(-2px);box-shadow:0 16px 30px rgba(223,23,35,.32)}
.button:active{transform:translateY(0)}
.privacy{margin-top:28px;color:#727b8a;font-size:12px;line-height:1.5}
.footer{margin-top:20px;text-align:center;color:rgba(255,255,255,.8);font-size:12px}
@media(max-width:600px){.card{padding:38px 24px;border-radius:20px}.button{width:100%;min-width:0}}
</style>
</head>
<body>
<div class="background"><div class="circle one"></div><div class="circle two"></div></div>
<main class="container">
<section class="card">
<div class="logo">✓</div>
<div class="eyebrow">Portal do Supermercado Opção</div>
<h1>Bem-vindo</h1>
<p class="subtitle">Este espaço foi preparado para facilitar o acesso aos serviços e informações destinados aos colaboradores.</p>
<div class="actions">
<a class="button" href="/nr1.html">🛡️ Acessar canal de denúncias</a>
</div>
<p class="privacy">O canal de denúncias possui acesso e informações protegidos.</p>
</section>
<div class="footer">© Supermercado Opção</div>
</main>
</body>
</html>
